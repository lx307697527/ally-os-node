# 本地开发依赖：PostgreSQL + MinIO（S3 兼容）。
#   docker compose up -d            只起依赖，应用用 pnpm dev 跑（热更新）
#   docker compose --profile app up 连同 api / worker / web 容器一起跑（验证镜像）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ally
      POSTGRES_PASSWORD: ally
      POSTGRES_DB: ally
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ally"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
             mc mb --ignore-existing local/ally-local"

  migrate:
    profiles: [app]
    build: { context: ., target: server }
    command: ["node", "packages/db/src/migrate.ts"]
    environment: &server-env
      DATABASE_URL: postgres://ally:ally@postgres:5432/ally
      S3_BUCKET: ally-local
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., target: server }
    environment: *server-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., target: server }
    command: ["node", "apps/worker/src/index.ts"]
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: [app]
    build: { context: ., target: web }
    ports: ["8080:8080"]

volumes:
  pgdata:
  miniodata:
