/* ── The booking embed does NOT share the prose's reading measure [BUG-445 / #4398] ──

   and paragraph above the widget. The booking card used to sit inside it, and
   inherited it: 672 − 48 (shell padding) − 68 (card padding) − 2 (border) left

   column clipped at the card edge. p1's 958 sat inside that band. 1208 − 48 −
   2 = 1158, i.e. past 900 + 256, matching `.iclosed-embed-shell`'s 1160 in the

   band. `bug445p2-schedule-embed-clears-activation.test.js` refuses that range
   explicitly rather than only checking `> 900`.

   below that the iframe slid back into 900…1156 where iClosed's extra ~256px

<script>
/* ════════════════════════════════════════════════════════════════════════
   /schedule, reverted to match production exactly (AN-DESIGN-001 sweep,
   Group 2B). The previous version of this file added a format gate and two
   questions (order volume, timeline) that do not exist in the real
   src/pages/Schedule.tsx — verified directly against
   Ally-Nutra-LLC-New/ally-nutra's origin/main, read-only, before writing
   this file (git show origin/main:<path>, never the working tree — the
   local checkout used for that read was itself several weeks stale and
   would have reported the wrong booking provider).

   TARGET SHAPE (src/pages/Schedule.tsx): back button · eyebrow · h1 · one
   line of body copy · an optional ?product= banner · the iClosed embed.
   Nothing else. No gate, no questions, no details form — none of those
   exist in production, so none of them survive here either.

   Every string below is production's own, with its source line:
     - "Schedule your call"                                  Schedule.tsx:38-40
     - "Let's find a time to talk."                            Schedule.tsx:41-43
     - "A 30-minute discovery call with our team — pick a
        slot that works for you." (THIRTY, not twenty — an
        earlier investigation read a snapshot from 2026-08-18
        that said 20; commit 3293c5a2 (2026-08-21) reverted
        the copy back to 30, and that is what origin/main
        says today)                                            Schedule.tsx:46-48
     - "Following up on your quote request" / "Product: …"     Schedule.tsx:50-58
     - "Your call is booked"                                   ThankYouBooked.tsx:152-154
     - "A calendar invite is on its way to your inbox with
        the meeting link and everything you need."             ThankYouBooked.tsx:156-159
     - "Not there in a few minutes? Check spam or promotions."  ThankYouBooked.tsx:161-165
     - the three "What happens next" items, verbatim,
        unchanged from the previous version of this file        ThankYouBooked.tsx:326-328

   NOT carried forward, and why:
     - Phone. iclosedEvents.ts / buildIClosedBookingUrl support an
       `iclosedPhone` param, but Schedule.tsx never passes one (only
       `{ name, email }`, Schedule.tsx:75) — so this file doesn't either.
       DELIBERATE — do not "fix" this by wiring a phone field back in.
     - UTM/ad-attribution forwarding — SUPERSEDED by [FEAT-859]: this page
       now forwards the visitor's saved attribution from
       ../shared/lead-attribution.js (see buildIClosedUrl).
     - An autoplaying VSL on the booked step. ThankYouBooked.tsx has a real
       one; this mockup has no video asset to embed. Faking it with a
       placeholder box (the previous version of this file did exactly that)
       is worse than admitting the gap, so it is simply not here.
   ════════════════════════════════════════════════════════════════════════ */

/* apps/landing/src/lib/iclosedBooking.js already implements this correctly
   for the SPA (ES module, imported by Contact.jsx's #book-a-call — the
   in-repo mechanical precedent this file follows). This page has no build
   step and cannot import it, so the same constants/logic are duplicated
   here rather than referenced — do not let the two drift apart silently. */
const ICLOSED_CONSULTATION_URL = 'https://app.iclosed.io/e/allynutra/ally-nutra-consultation';
const ICLOSED_ORIGIN = 'https://app.iclosed.io';
const ICLOSED_BOOKING_MESSAGE_TYPE = 'iclosed.call_scheduled';

/* ── The frame's height, and why there is no right constant [BUG-424 / #4154] ──

   This page used to hard-write height:780px on the iframe. The document inside
   it was 854px, so the last calendar row — 27-30 for September 2026 — sat 74px
   outside the visible area with nothing to say so.

   780 was not merely the wrong number; no number is right. Measured against the
   live widget on 2026-09-21, iClosed's height changes with the STEP the visitor
   is on (392 -> 484.5 -> 490px during one load) and with the WIDTH it is given,
   discontinuously: 490px laid out side-by-side at >=900px, 877px stacked at
   <=860px. This page's column is ~552px wide, which is why it lands on the tall
   stacked layout while /work-with-us lands on the short one — one constant, two
   opposite defects. The companion fix for the SPA's shared component is
   BUG-423 / #4153.

   iClosed announces the real height itself, in the message this file already
   mentions as noise to filter. Two properties of it are load-bearing and
   neither is guessable, so both were captured rather than assumed:

     { type: 'iclosed.widget_height', height: '392px' }
     { type: 'iclosed.widget_height', height: '484.5px' }

   `height` is a STRING with a px suffix — Number('392px') is NaN, so a parser
   written from the obvious assumption silently never resizes anything — and it
   can be FRACTIONAL, rounded UP because rounding down leaves half a pixel of
   the last row clipped, which is this very issue.

   ⚠️ This mirrors `readIClosedWidgetHeight` in apps/landing/src/lib/
   iclosedBooking.js, deliberately duplicated for the same reason the constants
   above are: this page has no build step and cannot import it. Keep the two in
   step — a change to one is a change to both. */
const ICLOSED_HEIGHT_MESSAGE_TYPE = 'iclosed.widget_height';

/* A reading outside this range is DISCARDED, not clamped, so the frame keeps
   whatever height it had. The direction is deliberate: a booking frame that is
   somewhat too tall is the defect being fixed here, while one collapsed to
   nothing is a dead booking surface. The bounds sit outside every height
   measured on the live widget (392 smallest, 889.5 largest). */
const ICLOSED_MIN_HEIGHT = 320;
const ICLOSED_MAX_HEIGHT = 4000;

/** The placeholder height, used until iClosed reports one and kept if it never does. */
const ICLOSED_FALLBACK_HEIGHT = 780;

/** The height iClosed reports, in whole CSS pixels, or null if this message carries none. */
function readIClosedWidgetHeight(data){
  if (!data || typeof data !== 'object') return null;
  if (data.type !== ICLOSED_HEIGHT_MESSAGE_TYPE) return null;
  const raw = data.height;
  if (typeof raw !== 'number' && typeof raw !== 'string') return null;
  // parseFloat, not Number: Number('392px') is NaN and px is what iClosed sends.
  const parsed = parseFloat(raw);
  if (!isFinite(parsed)) return null;
  const height = Math.ceil(parsed);
  if (height < ICLOSED_MIN_HEIGHT || height > ICLOSED_MAX_HEIGHT) return null;
  return height;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** iclosedName/iclosedEmail from this page's own address — see the "NOT carried forward"
    note above — plus [FEAT-859 / #5775] the visitor's saved attribution: ad tags, first
    touch (`ft_*`), visitor id (`an_vid`), Meta's browser cookies. Those come from
    ../shared/lead-attribution.js, the persistence layer this page lacked when the note
    above was written; ids and ad tags only. */
function buildIClosedUrl(name, email){
  const u = new URL(ICLOSED_CONSULTATION_URL);
  if (name) u.searchParams.set('iclosedName', name);
  if (email) u.searchParams.set('iclosedEmail', email);
  let saved = null;
  try {
    saved = window.AllyLeadAttribution ? window.AllyLeadAttribution.iclosedParams() : null;
  } catch (e) {
    saved = null;
  }
  if (saved) {
    for (const key of Object.keys(saved)) {
      if (saved[key]) u.searchParams.set(key, saved[key]);
    }
  }
  return u.toString();
}

/* Read once, on load — exactly what Schedule.tsx:15-19 does with
   useSearchParams(). No on-page form ever writes to these. */
const QP = new URLSearchParams(window.location.search);
const NAME = QP.get('name') || '';
const EMAIL = QP.get('email') || '';
const PRODUCT = QP.get('product') ? decodeURIComponent(QP.get('product')) : null;

/* `frameHeight` is remembered across renders on purpose. `render()` rebuilds
   #main's innerHTML, so stepping to the booked screen and back via "Run it
   again" destroys the iframe and builds a new one; without this the new frame
   would drop to the placeholder height and wait for iClosed to report again. */
const S = { step: 0, frameHeight: null };

const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';
const ICON_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';

function renderSchedule(){
  return `
    <button type="button" class="backbtn" data-back>${ICON_BACK}Back</button>

/* [BUG-445 / #4398] The embed renders into `#embed`, OUTSIDE `.card`, so it is
   sized by `.embed-shell` (1008px) rather than by the prose's 672px measure.
   `buildIClosedUrl` is called here rather than passed in, so this function owns
   the one thing it renders. */
function renderEmbed(){
  const src = buildIClosedUrl(NAME, EMAIL);
  return `
    <div class="embedcard">
      <iframe id="iclosedFrame" src="${src}" title="Select a date and time" style="width:100%;min-width:0;height:${S.frameHeight || ICLOSED_FALLBACK_HEIGHT}px;border:0;display:block"></iframe>
    </div>
  `;
}

function renderBooked(){
  return `

}

function render(){
  document.getElementById('main').innerHTML = S.step === 0 ? renderSchedule() : renderBooked();
  /* [BUG-445] Written on every render, exactly as it was when it lived inside
     `#main` — this change moved the embed, it did not change how often it is
     rebuilt. The height handler still resizes the frame IN PLACE rather than
     calling render(), for the reason recorded at that listener: a rebuild
     reloads the widget and loses the slot the visitor had already picked. */
  document.getElementById('embed').innerHTML = S.step === 0 ? renderEmbed() : '';
  document.getElementById('footTag').textContent = S.step === 0
    ? 'Static HTML prototype · copy/behaviour matched to production · the iClosed calendar below is real — booking through it books an actual call with Josh or Shaun'
    : 'Static HTML prototype · matches ThankYouBooked.tsx, minus the VSL (no video asset in this repo)';
}

/* The real booking signal. Same exact-match check as apps/landing's own
   isIClosedBookingMessage (src/lib/iclosedBooking.js) and production's
   isIClosedBookingMessage (iclosedEvents.ts) — a prefix test would fire on
   the ~60 iclosed.widget_height noise messages iClosed sends per visit. */
window.addEventListener('message', (e) => {
  if (e.origin !== ICLOSED_ORIGIN) return;
  let data = e.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch { return; }
  }

  /* Height first, and it RETURNS: these are ~60 of the ~64 messages a visit
     produces, so letting them fall through would run the booking test sixty
     times for nothing. The frame is resized in place rather than re-rendered —
     render() would rebuild the iframe and reload the widget, losing the slot
     the visitor had already picked. */
  const reported = readIClosedWidgetHeight(data);
  if (reported !== null) {
    S.frameHeight = reported;
    const frame = document.getElementById('iclosedFrame');
    if (frame) frame.style.height = reported + 'px';
    return;
  }

  if (data && typeof data === 'object' && data.type === ICLOSED_BOOKING_MESSAGE_TYPE) {
    /* [FEAT-899] One booking, one hand-over: iClosed repeats the message. */
    if (S.bookedCallToken) return;
    S.bookedCallToken = bookedCallToken();
    S.step = 1;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    /* [FEAT-820 p3 / #5613] Then on to the thank-you page, as /work-with-us does (owner,
       2026-09-30: "schedule a call should also land on the thank you booked page"). The
       pause is only for the visitor to read the confirmation: nothing in iClosed's frame
       reports the booking any more (its container GTM-K66NLG5N is empty, and Meta hears
       of bookings from the server, meta-capi-cron). 2500 ms is THANK_YOU_REDIRECT_MS in
       src/views/WorkWithUs.jsx; this page cannot import it.
       [FEAT-899 / #6022] The move carries the booking's single-use token as `previewId`:
       this is a separate document, so the SPA's in-memory hand-over cannot reach the
       thank-you page. The early redirect script the SPA's index.html loads first (the
       same path a redirect from iClosed would take; this page does not load it) reads it
       there, wipes the address before any tag loads, and hands it to
       src/lib/bookedCall.js, which counts the booking once (and reports it to Google Ads
       when the last paid click was Google). */
    const address = thankYouBookedAddress(S.bookedCallToken);
    setTimeout(() => { window.location.assign(address); }, 2500);
  }
});

/** [FEAT-899] A fresh single-use token for this booking — nothing from iClosed's message.
    It must pass the redirect script's id check: letters, digits, `_`, `-`, 8–64 long. */
function bookedCallToken(){
  let id = '';
  try {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') id = window.crypto.randomUUID();
  } catch (e) {
    id = '';
  }
  if (!id) id = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  return 'sch_' + id;
}

/** [FEAT-899] Where the booked visitor goes, carrying the token and nothing else. */
function thankYouBookedAddress(token){
  return '/thank-you-booked?previewId=' + encodeURIComponent(token);
}

document.addEventListener('click', (e) => {
