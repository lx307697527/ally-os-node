    # The static quote flow: its own CSP (vercel.json headers rule 2), and
    # no cache so a re-deploy is picked up immediately. `^~` keeps the
    # redirect regexes above from ever matching inside this directory.
    location ^~ /quote/ {
               add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $crawl_control always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Prototype mock prefixes: served by the old deployment's demo pages,
    # which are not ported (#45 slice 1). 404 beats silently showing the
    # marketing homepage at a URL that never meant that.
    location ~ ^/(visitor|super-admin|employee)(/|$) {
               add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag $crawl_control always;
        return 404;
    }

    # Single-page app: any other path falls back to index.html (filesystem
    # wins first, and `$uri/` serves directory indexes like /schedule/),
    # exactly like the Vercel catch-all rewrite.
    location / {
               add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
