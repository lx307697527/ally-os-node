name: CI

# PR 上自动跑；合并到 main 后由 deploy.yml 复用本流程，通过后才部署
on:
  pull_request:
    # 只改文档不跑 CI，省构建时间
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 在哪台机器上跑：仓库变量 CI_RUNNER 设为 self-hosted 就用你自己的机器，不设就用 GitHub 托管机器。
# 来自 fork 的 PR 永远用 GitHub 托管机器——外部代码不能在你的机器上执行。
# （各 job 的 runs-on 用同一个表达式；GitHub 不允许在 runs-on 里引用 env，所以只能重复写）

jobs:
  verify:
    name: Lint · Typecheck · Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ally
          POSTGRES_PASSWORD: ally
          POSTGRES_DB: ally
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U ally"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests (unit + integration against Postgres)
        env:
          DATABASE_URL: postgres://ally:ally@localhost:${{ job.services.postgres.ports['5432'] }}/ally
        run: pnpm test
      - name: Migrations are in sync with schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/src/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain packages/db/migrations
            exit 1
          fi

  docker:
    name: Docker images build
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        target: [server, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  terraform:
    name: Terraform validate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: infra/terraform/aws
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
